<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Treasure Rush</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07131b;
    }

    body {
      font-family: Arial, sans-serif;
      touch-action: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07131b;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #07131b;
      color: white;
      font-size: 22px;
      z-index: 9999;
    }

    #error {
      display: none;
      position: fixed;
      left: 15px;
      right: 15px;
      top: 30px;
      padding: 20px;
      background: #3b1010;
      color: #ffb0b0;
      border: 1px solid #ff5555;
      border-radius: 12px;
      z-index: 10000;
      font-family: Arial, sans-serif;
      white-space: pre-wrap;
      word-break: break-word;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <div id="loading">
    🏴‍☠️ Loading Treasure Rush...
  </div>

  <div id="error"></div>

  <div id="game-container"></div>

  <!-- Phaser -->
  <script
    src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js">
  </script>

  <script>
    window.addEventListener("error", function(event) {

      const errorBox = document.getElementById("error");
      const loading = document.getElementById("loading");

      loading.style.display = "none";
      errorBox.style.display = "block";

      errorBox.textContent =
        "TREASURE RUSH ERROR\n\n" +
        event.message +
        "\n\nFile: " +
        event.filename +
        "\nLine: " +
        event.lineno;
    });

    window.addEventListener("load", function() {

      setTimeout(function() {

        const loading =
          document.getElementById("loading");

        if (typeof Phaser === "undefined") {

          loading.style.display = "none";

          const errorBox =
            document.getElementById("error");

          errorBox.style.display = "block";

          errorBox.textContent =
            "Phaser.js load হয়নি.\n\n" +
            "Internet connection অথবা CDN সমস্যা হতে পারে.";

          return;
        }

        loading.style.display = "none";

      }, 1500);

    });
  </script>

  <!-- Your game -->
  <script src="game.js"></script>

</body>
</html>
